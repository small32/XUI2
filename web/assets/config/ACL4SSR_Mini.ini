;XUI2 面板自带的订阅规则（ACL4SSR_Mini）
;规则全部内联在本文件里，不引用任何外部站点：转换后端只取这一个文件就能生成配置。
;内容取自 ACL4SSR 的 Clash 规则集（3375 条），分组沿用其 Mini 方案：
;  🚀 节点选择 / ♻️ 自动选择 / 🎯 全球直连 / 🛑 全球拦截 / 🐟 漏网之鱼
;修改后通过静态资源摘要自动刷新缓存，客户端重新拉取订阅即可生效。


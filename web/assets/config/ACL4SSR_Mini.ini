[custom]
;XUI2 本地精简规则（ACL4SSR_Mini）
;随面板一起发布，不引用任何外部规则集：转换后端只需要取到本文件即可生成配置。
;分组沿用 ACL4SSR 精简版命名，便于和老订阅对照。
;分流顺序：广告拦截 -> 局域网/保留地址直连 -> 国内直连 -> 其余走代理。

;广告拦截：内联精简清单，命中即拒绝
ruleset=🛑 全球拦截,[]DOMAIN-SUFFIX,doubleclick.net
ruleset=🛑 全球拦截,[]DOMAIN-SUFFIX,googlesyndication.com
ruleset=🛑 全球拦截,[]DOMAIN-SUFFIX,googleadservices.com
ruleset=🛑 全球拦截,[]DOMAIN-SUFFIX,umeng.com
ruleset=🛑 全球拦截,[]DOMAIN-SUFFIX,cnzz.com
ruleset=🛑 全球拦截,[]DOMAIN-SUFFIX,adservice.google.com

;局域网与保留地址直连：不走代理
ruleset=🎯 全球直连,[]IP-CIDR,127.0.0.0/8
ruleset=🎯 全球直连,[]IP-CIDR,10.0.0.0/8
ruleset=🎯 全球直连,[]IP-CIDR,172.16.0.0/12
ruleset=🎯 全球直连,[]IP-CIDR,192.168.0.0/16
ruleset=🎯 全球直连,[]IP-CIDR,100.64.0.0/10

;国内地址直连
ruleset=🎯 全球直连,[]GEOIP,CN

;其余流量走代理
ruleset=🐟 漏网之鱼,[]FINAL

custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]DIRECT`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连`[]♻️ 自动选择`.*

enable_rule_generator=true
overwrite_original_rules=true

<!DOCTYPE html>
<html lang="zh">
{{template "head" .}}
<body>
<a-layout id="app" v-cloak style="min-height:100vh; padding-top:10vh">
  <a-layout-content>
    <a-row type="flex" justify="center">
      <a-col :xs="22" :sm="18" :md="12" :lg="8">
        <a-card title="首次登录：修改密码">
          <p>当前账号使用初始密码。修改密码后才能进入面板。</p>
          <a-form>
            <a-form-item label="当前密码"><a-input-password v-model="oldPassword" autocomplete="current-password" /></a-form-item>
            <a-form-item label="新密码"><a-input-password v-model="newPassword" autocomplete="new-password" /></a-form-item>
            <a-form-item label="确认新密码"><a-input-password v-model="confirmPassword" autocomplete="new-password" /></a-form-item>
            <p>新密码至少 12 个字符，且不能与初始密码相同。</p>
            <a-button type="primary" block :loading="loading" @click="submit">修改密码</a-button>
          </a-form>
          <a style="display:block; margin-top:16px" :href="basePath + 'logout'">退出登录</a>
        </a-card>
      </a-col>
    </a-row>
  </a-layout-content>
</a-layout>
{{template "js" .}}
<script>
const app = new Vue({
  delimiters: ['[[', ']]'],
  el: '#app',
  data: { oldPassword: '', newPassword: '', confirmPassword: '', loading: false },
  methods: {
    async submit() {
      if (this.newPassword !== this.confirmPassword) {
        this.$message.error('两次输入的新密码不一致');
        return;
      }
      this.loading = true;
      try {
        const result = await HttpUtil.post('/change-password', {
          oldPassword: this.oldPassword, newPassword: this.newPassword
        });
        if (result.success) location.href = basePath + 'xui/';
      } finally {
        this.loading = false;
      }
    }
  }
});
</script>
</body>
</html>

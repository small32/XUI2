{{define "inboundInfoModal"}}
{{template "component/inboundInfo" $}}
<a-modal id="inbound-info-modal" v-model="infoModal.visible" title="详细信息"
         :closable="true" :mask-closable="true" :width="infoModal.nodeInfos.length > 2 ? 1180 : (infoModal.nodeInfos.length > 1 ? 820 : 520)">
    <div v-if="infoModal.nodeInfos.length" class="node-info-grid" :class="'node-info-count-'+Math.min(infoModal.nodeInfos.length,3)">
        <div v-for="(ni, i) in infoModal.nodeInfos" :key="i" class="node-info-card">
            <p v-if="role === 'manager'" class="node-info-heading">
                <a-tag color="blue">节点：[[ ni.name ]]</a-tag>
                <span>节点倍率 <strong class="node-info-multiplier">[[ ni.trafficMultiplier ]]×</strong></span>
            </p>
            <inbound-info :db-inbound="ni.dbInbound" :inbound="ni.inbound"></inbound-info>
        </div>
    </div>
    <inbound-info v-else :db-inbound="dbInbound" :inbound="inbound"></inbound-info>
    <template slot="footer">
        <a-button @click="infoModal.close">{{ call $.i18n "close" }}</a-button>
    </template>
</a-modal>
<style>
    .node-info-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
    .node-info-count-1 { grid-template-columns: minmax(0, 1fr); }
    .node-info-count-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .node-info-card { min-width: 0; overflow-wrap: anywhere; }
    .node-info-heading { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .node-info-multiplier { color: #ff0000; font-size: 20px; font-weight: 700; }
    @media (max-width: 1000px) { .node-info-count-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 700px) { .node-info-grid { grid-template-columns: minmax(0, 1fr); } }
</style>
<script>

    const infoModal = {
        visible: false,
        inbound: new Inbound(),
        dbInbound: new DBInbound(),
        // manager 端每台被控端一份配置；非 manager 时仅本机一份。
        nodeInfos: [],
        show(dbInbound) {
            this.inbound = dbInbound.toInbound();
            this.dbInbound = new DBInbound(dbInbound);
            this.nodeInfos = [];
            this.visible = true;

            if (role === 'manager') {
                this.fillNodeInfos(dbInbound);
            } else {
                this.nodeInfos = [{ name: this.dbInbound.remark, dbInbound: this.dbInbound, inbound: this.inbound }];
            }

        },
        // 每台被控端一份配置：地址取被控端自己的订阅地址，而非管理端。
        async fillNodeInfos(dbInbound) {
            const remoteObjects = await app.loadRemoteInbounds(dbInbound);
            if (!remoteObjects) return;
            const infos = remoteObjects.map(ro => {
                const d = new DBInbound(ro);
                return { trafficMultiplier: ro.trafficMultiplier == null ? 1 : ro.trafficMultiplier, name: (ro.remoteName || '').trim() || dbInbound.remark, dbInbound: d, inbound: d.toInbound() };
            });
            this.nodeInfos = infos.length ? infos : [{ trafficMultiplier: 1, name: dbInbound.remark, dbInbound: this.dbInbound, inbound: this.inbound }];
        },
        close() {
            infoModal.visible = false;
        },
    };

    const infoModalApp = new Vue({
        delimiters: ['[[', ']]'],
        el: '#inbound-info-modal',
        data: {
            infoModal,
            role,
            get dbInbound() {
                return this.infoModal.dbInbound;
            },
            get inbound() {
                return this.infoModal.inbound;
            }
        },
    });

</script>
{{end}}

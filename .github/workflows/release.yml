name: Release XUI2

on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      version:
        description: 'New release version (for example 0.0.1)'
        required: true
        default: '0.0.1'

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          if [ "$VERSION" = main ]; then VERSION=$(tr -d '\r\n' < config/version); fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a version such as 0.0.1'; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            cc: gcc
            package: gcc
            xray: Xray-linux-64.zip
          - arch: arm64
            cc: aarch64-linux-gnu-gcc
            package: gcc-aarch64-linux-gnu
            xray: Xray-linux-arm64-v8a.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.package }}
      - name: Build and package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '1'
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VERSION" > config/version
          mkdir -p dist/xui/bin
          go build -trimpath -o dist/xui/xui main.go
          cp xui.service xui.sh LICENSE dist/xui/
          curl -fL --retry 3 "https://github.com/XTLS/Xray-core/releases/download/v26.3.27/${{ matrix.xray }}" -o xray.zip
          unzip -j xray.zip xray -d dist/xui/bin
          mv dist/xui/bin/xray "dist/xui/bin/xray-linux-${GOARCH}"
          for file in geoip.dat geosite.dat; do
            curl -fL --retry 3 "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/$file" -o "dist/xui/bin/$file"
          done
          chmod +x dist/xui/xui dist/xui/xui.sh "dist/xui/bin/xray-linux-${GOARCH}"
          test -s dist/xui/bin/geoip.dat
          test -s dist/xui/bin/geosite.dat
          if [ "$GOARCH" = amd64 ]; then
            dist/xui/xui -v
            dist/xui/bin/xray-linux-amd64 version
          fi
          tar -C dist -czf "xui-linux-${GOARCH}.tar.gz" xui
          tar -tzf "xui-linux-${GOARCH}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: xui-linux-${{ matrix.arch }}
          path: xui-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xui-linux-*
          merge-multiple: true
          path: release
      - name: Publish complete release
        working-directory: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            test -s "xui-linux-${arch}.tar.gz"
          done
          sha256sum xui-linux-*.tar.gz > SHA256SUMS
          printf '%s\n' \
            'XUI2 将面板分为管理端与被控端，安装时选择角色。' \
            '管理端通过 HTTPS Web API 向多台被控端同步账号，汇总流量并执行共享限额。' \
            '被控端保存本机月度流量快照；失败同步与 Xray 重载可重试。' \
            '安装包支持 Linux amd64 和 arm64，包含 Xray-core v26.3.27。' > notes.md
          gh release create "$VERSION" --target "$COMMIT" --title "XUI2 $VERSION" --notes-file notes.md --draft xui-linux-*.tar.gz SHA256SUMS
          gh release edit "$VERSION" --draft=false --prerelease=false --latest

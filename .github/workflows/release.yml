name: Release XUI2

on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      version:
        description: 'New release version (for example 0.0.1)'
        required: true
        default: '0.0.1'

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          if [ "$VERSION" = main ]; then VERSION=$(tr -d '\r\n' < config/version); fi
          # tag 形如 v0.0.6，先剥掉 v 前缀再校验，便于用 tag 直接触发发布
          VERSION=${VERSION#v}
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a version such as 0.0.1'; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-amd64:
    needs: prepare
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: '1'
      CC: x86_64-linux-musl-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Run tests
        run: go test ./...
      - name: Build and package
        run: |
          set -euo pipefail
          printf '%s\n' "$VERSION" > config/version
          mkdir -p dist/xui/bin
          go build -trimpath -ldflags '-linkmode external -extldflags "-static"' -o dist/xui/xui main.go
          cp xui.service xui.sh LICENSE dist/xui/
          curl -fL --retry 3 "https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip" -o xray.zip
          unzip -j xray.zip xray -d dist/xui/bin
          mv dist/xui/bin/xray "dist/xui/bin/xray-linux-${GOARCH}"
          for file in geoip.dat geosite.dat; do
            curl -fL --retry 3 "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/$file" -o "dist/xui/bin/$file"
          done
          chmod +x dist/xui/xui dist/xui/xui.sh "dist/xui/bin/xray-linux-${GOARCH}"
          test -s dist/xui/bin/geoip.dat
          test -s dist/xui/bin/geosite.dat
          # 确认面板为纯静态链接：不依赖宿主 glibc 版本，任意 Linux 均可运行
          file dist/xui/xui
          if file dist/xui/xui | grep -q 'statically linked'; then
            echo "static link OK"
          else
            echo "dynamic link detected"
            exit 1
          fi
          dist/xui/xui -v
          dist/xui/bin/xray-linux-amd64 version
          tar -C dist -czf "xui-linux-amd64.tar.gz" xui
          tar -tzf "xui-linux-amd64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: xui-linux-amd64
          path: xui-linux-amd64.tar.gz
          if-no-files-found: error

  build-arm64:
    needs: prepare
    runs-on: ubuntu-22.04
    container: dockcross/linux-arm64-musl:latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GOOS: linux
      GOARCH: arm64
      CGO_ENABLED: '1'
      CC: aarch64-linux-musl-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: Install packaging tools
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl unzip ca-certificates
      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$VERSION" > config/version
          mkdir -p dist/xui/bin
          go build -trimpath -ldflags '-linkmode external -extldflags "-static"' -o dist/xui/xui main.go
          cp xui.service xui.sh LICENSE dist/xui/
          curl -fL --retry 3 "https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-arm64-v8a.zip" -o xray.zip
          unzip -j xray.zip xray -d dist/xui/bin
          mv dist/xui/bin/xray "dist/xui/bin/xray-linux-${GOARCH}"
          for file in geoip.dat geosite.dat; do
            curl -fL --retry 3 "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/$file" -o "dist/xui/bin/$file"
          done
          chmod +x dist/xui/xui dist/xui/xui.sh "dist/xui/bin/xray-linux-${GOARCH}"
          test -s dist/xui/bin/geoip.dat
          test -s dist/xui/bin/geosite.dat
          # 确认面板为纯静态链接：不依赖宿主 glibc 版本，任意 Linux 均可运行
          file dist/xui/xui
          if file dist/xui/xui | grep -q 'statically linked'; then
            echo "static link OK"
          else
            echo "dynamic link detected"
            exit 1
          fi
          tar -C dist -czf "xui-linux-arm64.tar.gz" xui
          tar -tzf "xui-linux-arm64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: xui-linux-arm64
          path: xui-linux-arm64.tar.gz
          if-no-files-found: error

  publish:
    needs: [prepare, build-amd64, build-arm64]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xui-linux-*
          merge-multiple: true
          path: release
      - name: Publish complete release
        working-directory: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            test -s "xui-linux-${arch}.tar.gz"
          done
          sha256sum xui-linux-*.tar.gz > SHA256SUMS
          printf '%s\n' \
            'XUI2 将面板分为管理端与被控端，安装时选择角色。' \
            '管理端通过 HTTPS Web API 向多台被控端同步账号，汇总流量并执行共享限额。' \
            '被控端保存本机月度流量快照；失败同步与 Xray 重载可重试。' \
            '支持按账号选择下发节点，以及为不同被控端设置不同协议，账号公共信息与密码保持一致。' \
            '被控端本地入站流量按端口计入共享额度，同端口配置以管理端下发配置为准。' \
            '订阅与二维码使用各被控端的实际协议和连接配置。' \
            '支持本机系统代理，上级服务器通过原有 Xray 配置模版配置。' \
            '被控端支持非负小数流量倍率，默认 1；共享额度及超限自动停用按各节点倍率后的计费用量汇总。' \
            '客户端下载统一使用指定 GitHub 仓库的最新正式版 Release，取消手工上传安装包和手工外部分发。' \
            '私有仓库通过 GitHub App 首次连接授权，管理端自动续取访问凭据，重启后恢复，无需手工填写令牌；公开仓库无需授权。' \
            '管理端启动后及每 10 分钟自动检查最新 Release，检查失败保留上次成功结果，支持立即检查。' \
            '默认直连 GitHub；启用本机上级代理时默认代理中转，中转支持 Range 和每账号最多 5 个并发下载线程。' \
            '客户端下载位于入站列表顶部，端口账号可见；点击下载地址弹窗纵向展示各平台安装包，下载按钮位于版本号右侧，减少行高。' \
            '下载地址旁新增使用说明弹窗，管理员可在面板设置中编辑图文与 HTML，支持本地图片、预览和保存后即时生效。' \
            '使用说明图片支持点击查看原图，可切换适应窗口与原始尺寸，长图支持滚动，关闭后保留说明位置。' \
            '使用说明支持 id、旧式 a name 和中文文内锚点，在预览或阅读窗口内定位，不改变面板页面地址。' \
            '修复同版本覆盖更新仍使用旧编辑器脚本的问题，静态资源地址按内容摘要自动更新缓存标识。' \
            '修复普通中转下载发送空 Range 请求头导致 GitHub CDN 返回 HTTP 501，保留有效分段下载和每账号最多 5 个并发线程。' \
            '新增仅管理端提供的客户端登录、账单查询及 Clash YAML 订阅接口，支持令牌刷新和密码变更失效。' \
            '面板配置可管理客户端服务地址、Release 地址与 GitHub 授权状态，入站列表顶部提供各平台下载入口。' \
            '入站详细信息显示红色节点倍率，各节点横向排列，每行最多三个并自动换行，兼容窄屏。' \
            '流量汇总节点明细新增流量倍率、实际用量，原用量显示计费用量；原始计数保留，月度历史按结算倍率保存。' \
            '管理端入站列表支持快到期筛选，可与状态筛选组合，显示未来 7 天内到期的账号。' \
            '被控端系统状态横排展示实时上传、下载速度和本月累计上传、下载量，使用 | 分隔，不显示合计总流量。' \
            '修复 acme.sh 安装失败误判及 BBR 菜单静默退出，兼容 Armbian 已启用 BBR 的内核。' \
            '安装包支持 Linux amd64 和 arm64，包含 Xray-core v26.3.27。' > notes.md
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release delete "$VERSION" --yes
          fi
          gh release create "$VERSION" --target "$COMMIT" --title "XUI2 $VERSION" --notes-file notes.md --draft xui-linux-*.tar.gz SHA256SUMS
          gh release edit "$VERSION" --draft=false --prerelease=false --latest
